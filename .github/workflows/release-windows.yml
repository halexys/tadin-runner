name: Windows Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión (ej: v0.1.5)'
        required: true
      environment:
        description: 'Entorno (solo para notificaciones)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      releases_url:
        description: 'URL base de releases'
        required: true
      market_url:
        description: 'URL del marketplace'
        required: true

env:
  TADIN_VERSION: ${{ github.event.inputs.version }}

jobs:
  build-windows:
    runs-on: windows-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          repository: empty-nameAI/tadin-service
          ref: ${{ env.TADIN_VERSION }}
          token: ${{ secrets.GH_PAT }}

      - uses: actions/checkout@v4
        with:
          repository: empty-nameAI/tadin-app
          ref: ${{ env.TADIN_VERSION }}
          path: tadin-app
          token: ${{ secrets.GH_PAT }}

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: tadin-app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install uv
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
        shell: pwsh

      - name: Patch version and updater endpoint
        shell: pwsh
        run: |
          $version = "${{ env.TADIN_VERSION }}".TrimStart('v')
          $relUrl = "${{ github.event.inputs.releases_url }}"
          $confPath = "tadin-app/src-tauri/tauri.conf.json"
          $d = Get-Content $confPath -Raw | ConvertFrom-Json -AsHashtable
          $d.version = $version
          if (-not $d.plugins) { $d.plugins = @{} }
          if (-not $d.plugins.updater) { $d.plugins.updater = @{} }
          $d.plugins.updater.endpoints = @("$relUrl/latest.json")
          $d | ConvertTo-Json -Depth 50 | Set-Content $confPath

      - name: Patch install.ps1 / tadin-update.ps1 placeholders
        shell: pwsh
        run: |
          $version = "${{ env.TADIN_VERSION }}".TrimStart('v')
          $relUrl  = "${{ github.event.inputs.releases_url }}"
          $mktUrl  = "${{ github.event.inputs.market_url }}"
          foreach ($f in @(
            "tadin-app/src-tauri/scripts/install.ps1",
            "tadin-app/src-tauri/scripts/tadin-update.ps1"
          )) {
            if (Test-Path $f) {
              (Get-Content $f -Raw) `
                -replace '\$TadinVersion\s*=\s*"[^"]*"', "`$TadinVersion = `"$version`"" `
                -replace '\$ReleasesBase\s*=\s*"[^"]*"', "`$ReleasesBase = `"$relUrl`"" `
                -replace '\$MarketUrl\s*=\s*"[^"]*"',    "`$MarketUrl    = `"$mktUrl`"" `
                | Set-Content $f
            }
          }

      - name: Build Python wheel
        shell: pwsh
        run: |
          $version = "${{ env.TADIN_VERSION }}".TrimStart('v')
          # PEP 440 forbids semver pre-release syntax (e.g. 0.1.8-staging).
          # Strip everything after the first '-' for the wheel version.
          $pyVersion = $version -replace '-.*$', ''
          (Get-Content pyproject.toml) `
            -replace '^version\s*=\s*".*"', "version = `"$pyVersion`"" `
            | Set-Content pyproject.toml
          uv build --wheel --out-dir dist

      - name: Install dependencies
        working-directory: tadin-app
        run: pnpm install --frozen-lockfile

      - name: Build Tauri (Windows NSIS)
        working-directory: tadin-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_MARKET_URL: ${{ github.event.inputs.market_url }}
          VITE_RELEASES_URL: ${{ github.event.inputs.releases_url }}
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Collect artifacts
        shell: pwsh
        run: |
          $bundleDir = "tadin-app\src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis"
          New-Item -ItemType Directory -Force out | Out-Null
          # NSIS setup .exe (full installer)
          $setup = Get-ChildItem "$bundleDir\*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setup) { Copy-Item $setup.FullName "out\tadin-windows-x86_64-setup.exe" }
          # Updater package .nsis.zip + signature
          $zip = Get-ChildItem "$bundleDir\*-setup.nsis.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($zip) { Copy-Item $zip.FullName "out\tadin-windows-x86_64.nsis.zip" }
          $sig = Get-ChildItem "$bundleDir\*-setup.nsis.zip.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sig) { Copy-Item $sig.FullName "out\tadin-windows-x86_64.nsis.zip.sig" }
          # Wheel (built earlier)
          $wheel = Get-ChildItem "dist\tadin_backend-*-py3-none-any.whl" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($wheel) { Copy-Item $wheel.FullName "out\$($wheel.Name)" }
          # Scripts (patched versions)
          Copy-Item tadin-app\src-tauri\scripts\install.ps1            out\install.ps1 -ErrorAction SilentlyContinue
          Copy-Item tadin-app\src-tauri\scripts\tadin-service-start.ps1 out\tadin-service-start.ps1 -ErrorAction SilentlyContinue
          Copy-Item tadin-app\src-tauri\scripts\tadin-update.ps1        out\tadin-update.ps1 -ErrorAction SilentlyContinue
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            out/*.exe
            out/*.nsis.zip
            out/*.nsis.zip.sig
            out/*.whl
            out/*.ps1
          if-no-files-found: warn

      - name: Notify
        if: always()
        shell: pwsh
        run: |
          $status = "${{ job.status }}"
          $tags = if ($status -eq 'success') { 'white_check_mark' } else { 'x' }
          $topic = "${{ secrets.NTFY_TOPIC }}"
          if ($topic) {
            try {
              Invoke-WebRequest "https://ntfy.sh/$topic" `
                -Method Post `
                -Headers @{
                  'Title' = "Windows -- $status (${{ github.event.inputs.environment }})"
                  'Tags' = $tags
                  'Priority' = 'default'
                } `
                -Body "Release ${{ env.TADIN_VERSION }} -- Windows $status" `
                -UseBasicParsing -TimeoutSec 10 | Out-Null
            } catch { }
          }
