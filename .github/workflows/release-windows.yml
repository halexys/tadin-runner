name: Windows Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión (ej: v0.1.5)'
        required: true
      environment:
        description: 'Entorno (solo para notificaciones)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      releases_url:
        description: 'URL base de releases (solo VITE de la app)'
        required: false
      market_url:
        description: 'URL del marketplace'
        required: true

env:
  TADIN_VERSION: ${{ github.event.inputs.version }}

jobs:
  build-windows:
    runs-on: windows-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          repository: empty-nameAI/tadin-service
          ref: ${{ env.TADIN_VERSION }}
          token: ${{ secrets.GH_PAT }}

      - uses: actions/checkout@v4
        with:
          repository: empty-nameAI/tadin-app
          ref: ${{ env.TADIN_VERSION }}
          path: tadin-app
          token: ${{ secrets.GH_PAT }}

      - uses: actions/checkout@v4
        with:
          repository: empty-nameAI/tadin-installer
          path: tadin-installer
          token: ${{ secrets.GH_PAT }}

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tadin-installer -> target
            tadin-app/src-tauri -> target

      - name: Install uv
        shell: pwsh
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Patch tauri version
        shell: pwsh
        run: |
          $version = "${{ env.TADIN_VERSION }}".TrimStart('v')
          $confPath = "tadin-app/src-tauri/tauri.conf.json"
          $d = Get-Content $confPath -Raw | ConvertFrom-Json -AsHashtable
          $d.version = $version
          $d | ConvertTo-Json -Depth 50 | Set-Content $confPath

      # ── Payloads propios (no públicos) → se embeben en tadin-setup.exe ────────
      - name: Build Python wheel → embed
        shell: pwsh
        run: |
          $version = "${{ env.TADIN_VERSION }}".TrimStart('v')
          # PEP 440 prohíbe sufijos semver (0.1.8-staging) en el wheel.
          $pyVersion = $version -replace '-.*$', ''
          (Get-Content pyproject.toml) `
            -replace '^version\s*=\s*".*"', "version = `"$pyVersion`"" `
            | Set-Content pyproject.toml
          uv build --wheel --out-dir dist
          New-Item -ItemType Directory -Force tadin-installer/embed | Out-Null
          $wheel = Get-ChildItem "dist/tadin_backend-*.whl" | Select-Object -First 1
          Copy-Item $wheel.FullName tadin-installer/embed/tadin_backend.whl
          # pip exige el nombre real del wheel ({nombre}-{versión}-...whl) al instalar.
          Set-Content -NoNewline -Path tadin-installer/embed/wheel_name.txt -Value $wheel.Name
          # Las deps del wheel se resuelven desde PyPI en la instalación (público).

      - name: Install node deps
        working-directory: tadin-app
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (sin bundle) → embed
        working-directory: tadin-app
        env:
          VITE_MARKET_URL: ${{ github.event.inputs.market_url }}
          VITE_RELEASES_URL: ${{ github.event.inputs.releases_url }}
        run: |
          # Desktop: el backend local escucha en 8080 (CSP de Tauri lo permite).
          # .env.production.local tiene prioridad sobre .env.production (que apunta
          # a /app/api/v1 del deploy web). Determinista, sin depender de que Vite
          # tome las env vars del proceso.
          @"
          VITE_API_URL=http://localhost:8080/api/v1
          VITE_WS_URL=ws://localhost:8080
          VITE_MARKET_URL=${{ github.event.inputs.market_url }}
          VITE_RELEASES_URL=${{ github.event.inputs.releases_url }}
          "@ | Set-Content -Encoding utf8 .env.production.local
          pnpm tauri build --target x86_64-pc-windows-msvc --no-bundle
          Copy-Item "src-tauri/target/x86_64-pc-windows-msvc/release/tadin.exe" "../tadin-installer/embed/tadin.exe"

      # ── Build del instalador en dos pasadas: primero el agente (para embeberlo),
      #    luego el setup que embebe app + wheel + agente. ───────────────────────
      - name: Build installer (agente → embed → setup)
        working-directory: tadin-installer
        run: |
          $target = "x86_64-pc-windows-msvc"
          cargo build --release --target $target --bin tadin-agent
          Copy-Item "target/$target/release/tadin-agent.exe" "embed/tadin-agent.exe" -Force
          cargo build --release --target $target --bin tadin-setup
          New-Item -ItemType Directory -Force ../out | Out-Null
          Copy-Item "target/$target/release/tadin-setup.exe" "../out/tadin-setup.exe"
          $mb = [math]::Round((Get-Item ../out/tadin-setup.exe).Length / 1MB, 1)
          Write-Host "tadin-setup.exe = $mb MB"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/tadin-setup.exe
          if-no-files-found: error

      - name: Notify
        if: always()
        shell: pwsh
        run: |
          $status = "${{ job.status }}"
          $tags = if ($status -eq 'success') { 'white_check_mark' } else { 'x' }
          $topic = "${{ secrets.NTFY_TOPIC }}"
          if ($topic) {
            try {
              Invoke-WebRequest "https://ntfy.sh/$topic" `
                -Method Post `
                -Headers @{
                  'Title' = "Windows -- $status (${{ github.event.inputs.environment }})"
                  'Tags' = $tags
                  'Priority' = 'default'
                } `
                -Body "Release ${{ env.TADIN_VERSION }} -- Windows $status" `
                -UseBasicParsing -TimeoutSec 10 | Out-Null
            } catch { }
          }
