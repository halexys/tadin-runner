name: Windows Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión (ej: v0.1.5)'
        required: true
      environment:
        description: 'Entorno (solo para notificaciones)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      releases_url:
        description: 'URL base de releases'
        required: true
      market_url:
        description: 'URL del marketplace'
        required: true

env:
  TADIN_VERSION: ${{ github.event.inputs.version }}

jobs:
  build-windows:
    runs-on: windows-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          repository: empty-nameAI/tadin-service
          ref: ${{ env.TADIN_VERSION }}
          token: ${{ secrets.GH_PAT }}

      - uses: actions/checkout@v4
        with:
          repository: empty-nameAI/tadin-app
          ref: ${{ env.TADIN_VERSION }}
          path: tadin-app
          token: ${{ secrets.GH_PAT }}

      - uses: actions/checkout@v4
        with:
          repository: empty-nameAI/tadin-installer
          path: tadin-installer
          token: ${{ secrets.GH_PAT }}

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: tadin-app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install uv
        shell: pwsh
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Download SurrealDB, uv and VC++ redist
        shell: pwsh
        run: |
          $payload = "payload"
          New-Item -ItemType Directory -Force $payload | Out-Null

          # Versión de SurrealDB que espera el servicio (verbatim del antiguo install.ps1).
          $surrealVer = "v3.0.5"
          $uvLatest = (Invoke-RestMethod "https://api.github.com/repos/astral-sh/uv/releases/latest").tag_name
          Write-Host "SurrealDB $surrealVer / uv $uvLatest"

          $surrealUrl = "https://github.com/surrealdb/surrealdb/releases/download/$surrealVer/surreal-$surrealVer.windows-amd64.exe"
          $uvZipUrl   = "https://github.com/astral-sh/uv/releases/download/$uvLatest/uv-x86_64-pc-windows-msvc.zip"
          $vcUrl      = "https://aka.ms/vs/17/release/vc_redist.x64.exe"

          curl.exe -fsSL -o "$payload/surreal.exe" $surrealUrl
          if ($LASTEXITCODE -ne 0) { throw "SurrealDB download failed: $surrealUrl" }

          $uvZip = Join-Path $env:TEMP "uv-windows.zip"
          curl.exe -fsSL -o $uvZip $uvZipUrl
          if ($LASTEXITCODE -ne 0) { throw "uv download failed: $uvZipUrl" }
          Expand-Archive -Path $uvZip -DestinationPath "$payload/uv-tmp" -Force
          Move-Item "$payload/uv-tmp/uv.exe" "$payload/uv.exe" -Force
          Remove-Item -Recurse -Force "$payload/uv-tmp", $uvZip

          curl.exe -fsSL -o "$payload/vc_redist.x64.exe" $vcUrl
          if ($LASTEXITCODE -ne 0) { throw "VC++ redist download failed: $vcUrl" }

      - name: Patch tauri version
        shell: pwsh
        run: |
          $version = "${{ env.TADIN_VERSION }}".TrimStart('v')
          $confPath = "tadin-app/src-tauri/tauri.conf.json"
          $d = Get-Content $confPath -Raw | ConvertFrom-Json -AsHashtable
          $d.version = $version
          $d | ConvertTo-Json -Depth 50 | Set-Content $confPath

      - name: Build Python wheel and bundle deps
        shell: pwsh
        run: |
          $version = "${{ env.TADIN_VERSION }}".TrimStart('v')
          # PEP 440 prohíbe sufijos semver (0.1.8-staging) en el wheel.
          $pyVersion = $version -replace '-.*$', ''
          (Get-Content pyproject.toml) `
            -replace '^version\s*=\s*".*"', "version = `"$pyVersion`"" `
            | Set-Content pyproject.toml
          uv build --wheel --out-dir dist

          # Deps offline para el venv del instalador (--no-index --find-links).
          $payload = "payload"
          $wheel   = Get-ChildItem "dist/tadin_backend-*.whl" | Select-Object -First 1
          $pipVenv = "$env:TEMP\pip-dl-venv"
          uv venv $pipVenv --python 3.13 --seed
          & "$pipVenv\Scripts\python.exe" -m pip download --prefer-binary --dest $payload $wheel.FullName
          if ($LASTEXITCODE -ne 0) { throw "pip download failed (exit $LASTEXITCODE)" }
          Remove-Item -Recurse -Force $pipVenv
          Copy-Item $wheel.FullName $payload
          Write-Host "Wheel + deps en payload/"

      - name: Install node deps
        working-directory: tadin-app
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (sin bundle)
        working-directory: tadin-app
        env:
          VITE_MARKET_URL: ${{ github.event.inputs.market_url }}
          VITE_RELEASES_URL: ${{ github.event.inputs.releases_url }}
        run: |
          pnpm tauri build --target x86_64-pc-windows-msvc --bundles none
          Copy-Item "src-tauri/target/x86_64-pc-windows-msvc/release/tadin.exe" "../payload/tadin.exe"

      - name: Build installer (Rust)
        working-directory: tadin-installer
        env:
          TADIN_RELEASES_BASE: ${{ github.event.inputs.releases_url }}
        run: |
          cargo build --release --target x86_64-pc-windows-msvc
          $rel = "target/x86_64-pc-windows-msvc/release"
          Copy-Item "$rel/tadin-agent.exe" "../payload/tadin-agent.exe"
          # tadin-setup.exe NO va en payload: es el binario que el usuario descarga aparte.
          New-Item -ItemType Directory -Force ../out | Out-Null
          Copy-Item "$rel/tadin-setup.exe" "../out/tadin-setup.exe"

      - name: Sign payloads and build manifest
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cargo install rsign2 --quiet
          # rsign espera la clave en fichero; la key de Tauri es base64 del .key minisign.
          $keyFile = Join-Path $env:TEMP "tadin.key"
          [System.IO.File]::WriteAllText($keyFile,
            [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:TAURI_SIGNING_PRIVATE_KEY)))

          $entries = @()
          foreach ($f in Get-ChildItem payload -File) {
            $env:RSIGN_PASSWORD = $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            echo $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD | rsign sign -s $keyFile "$($f.FullName)"
            $sig = Get-Content "$($f.FullName).minisig" -Raw
            $entries += @{ name = $f.Name; url = "${{ github.event.inputs.releases_url }}/$($f.Name)"; sig = $sig }
          }
          Remove-Item $keyFile -Force

          $version = "${{ env.TADIN_VERSION }}".TrimStart('v')
          @{ version = $version; files = $entries } | ConvertTo-Json -Depth 10 | Set-Content payload/manifest.json
          @{ version = $version } | ConvertTo-Json | Set-Content payload/latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            out/tadin-setup.exe
            payload/**
          if-no-files-found: warn

      - name: Notify
        if: always()
        shell: pwsh
        run: |
          $status = "${{ job.status }}"
          $tags = if ($status -eq 'success') { 'white_check_mark' } else { 'x' }
          $topic = "${{ secrets.NTFY_TOPIC }}"
          if ($topic) {
            try {
              Invoke-WebRequest "https://ntfy.sh/$topic" `
                -Method Post `
                -Headers @{
                  'Title' = "Windows -- $status (${{ github.event.inputs.environment }})"
                  'Tags' = $tags
                  'Priority' = 'default'
                } `
                -Body "Release ${{ env.TADIN_VERSION }} -- Windows $status" `
                -UseBasicParsing -TimeoutSec 10 | Out-Null
            } catch { }
          }
